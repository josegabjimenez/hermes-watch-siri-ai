name: PersonalWatchApp
options:
  bundleIdPrefix: dev.josegabjimenez
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  PersonalWatchCore:
    path: Packages/PersonalWatchCore
targets:
  PersonalWatchAppiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
    dependencies:
      - package: PersonalWatchCore
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - target: PersonalWatchAppWatch
        embed: true
    settings:
      # Preserve the saved AppIntent Swift identity and installed app container.
      PRODUCT_MODULE_NAME: HermesCaptureiOS
      PRODUCT_BUNDLE_IDENTIFIER: dev.josegabjimenez.HermesCapture
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: 0.3.4
      CURRENT_PROJECT_VERSION: 7
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Personal Watch App
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  PersonalWatchAppWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/Watch
      - path: Apps/Shared
    dependencies:
      - package: PersonalWatchCore
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
    settings:
      # Preserve the saved AppIntent Swift identity and installed app container.
      PRODUCT_MODULE_NAME: HermesCaptureWatch
      PRODUCT_BUNDLE_IDENTIFIER: dev.josegabjimenez.HermesCapture.watchkitapp
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: 0.3.4
      CURRENT_PROJECT_VERSION: 7
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Personal Watch App
      INFOPLIST_KEY_WKApplication: YES
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.josegabjimenez.HermesCapture
      INFOPLIST_KEY_WKWatchOnly: NO
  PersonalWatchAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: PersonalWatchAppiOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
  PersonalWatchCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/PersonalWatchCore/Tests/PersonalWatchCoreTests
    dependencies:
      - package: PersonalWatchCore
      - target: PersonalWatchCoreTestHost
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PersonalWatchCoreTestHost.app/PersonalWatchCoreTestHost"
      BUNDLE_LOADER: "$(TEST_HOST)"
  PersonalWatchCoreTestHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Host
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  PersonalWatchAppiOS:
    build:
      targets:
        PersonalWatchAppiOS: all
    test:
      targets:
        - PersonalWatchCoreTests
        - PersonalWatchAppUITests
  PersonalWatchAppWatch:
    build:
      targets:
        PersonalWatchAppWatch: all
