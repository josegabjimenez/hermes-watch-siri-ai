name: HermesCapture
options:
  bundleIdPrefix: dev.josegabjimenez
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  HermesCore:
    path: Packages/HermesCore
targets:
  HermesCaptureiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
    dependencies:
      - package: HermesCore
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - target: HermesCaptureWatch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.josegabjimenez.HermesCapture
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: 0.3.4
      CURRENT_PROJECT_VERSION: 7
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Hermes
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  HermesCaptureWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Apps/Watch
      - path: Apps/Shared
    dependencies:
      - package: HermesCore
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.josegabjimenez.HermesCapture.watchkitapp
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: 0.3.4
      CURRENT_PROJECT_VERSION: 7
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Hermes
      INFOPLIST_KEY_WKApplication: YES
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.josegabjimenez.HermesCapture
      INFOPLIST_KEY_WKWatchOnly: NO
  HermesCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: HermesCaptureiOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
  HermesCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/HermesCore/Tests/HermesCoreTests
    dependencies:
      - package: HermesCore
      - target: HermesCoreTestHost
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HermesCoreTestHost.app/HermesCoreTestHost"
      BUNDLE_LOADER: "$(TEST_HOST)"
  HermesCoreTestHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Host
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  HermesCaptureiOS:
    build:
      targets:
        HermesCaptureiOS: all
    test:
      targets:
        - HermesCoreTests
        - HermesCaptureUITests
  HermesCaptureWatch:
    build:
      targets:
        HermesCaptureWatch: all
